name: Publish Hostinger artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-production
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Update deployment branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          artifact_dir="${RUNNER_TEMP}/neuracode-dist"
          mkdir -p "$artifact_dir"
          cp -R dist/. "$artifact_dir/"
          if git ls-remote --exit-code --heads origin hostinger-production; then
            git checkout -B hostinger-production origin/hostinger-production
            git rm -rf .
          else
            git checkout --orphan hostinger-production
            git rm -rf .
          fi
          git clean -fdx
          cp -R "$artifact_dir"/. .
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "Published artifact is unchanged; no deployment commit is needed."
            exit 0
          fi
          git commit -m "chore: publish Hostinger artifact from ${GITHUB_SHA}"
          git push origin HEAD:hostinger-production
