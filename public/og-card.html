<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="robots" content="noindex"><title>Neuracode social card</title><style>*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden;font-family:Inter,Arial,sans-serif;background:#081225;color:#fff}.card{position:relative;width:1200px;height:630px;padding:72px 78px;display:grid;grid-template-columns:1.25fr .75fr;gap:70px;align-items:center;background:radial-gradient(circle at 85% 15%,rgba(160,32,240,.28),transparent 30%),#081225}.card:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(46,118,229,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(46,118,229,.09) 1px,transparent 1px);background-size:54px 54px;mask-image:linear-gradient(90deg,transparent,#000)}.copy,.visual{position:relative;z-index:1}.logo-plate{display:inline-flex;background:#fff;border-radius:18px;padding:10px 18px;margin-bottom:48px}.logo-plate img{display:block;width:230px;height:auto}.eyebrow{color:#c5a3ff;font-size:18px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;margin-bottom:20px}h1{font-size:58px;line-height:1.05;letter-spacing:-.045em;margin:0;max-width:720px}.visual{height:390px;border:1px solid rgba(197,163,255,.28);border-radius:32px;background:linear-gradient(145deg,rgba(46,118,229,.2),rgba(160,32,240,.08));display:grid;place-items:center}.nodes{width:260px;height:260px;position:relative}.node{position:absolute;width:84px;height:84px;border:1px solid rgba(197,163,255,.7);background:rgba(8,18,37,.75);border-radius:18px}.n1{left:0;top:88px}.n2{right:0;top:0;border-color:#2e76e5}.n3{right:18px;bottom:0;border-color:#a020f0}.line{position:absolute;height:2px;background:linear-gradient(90deg,#2e76e5,#a020f0);transform-origin:left}.l1{width:150px;left:67px;top:117px;transform:rotate(-27deg)}.l2{width:118px;left:145px;top:86px;transform:rotate(67deg)}</style></head><body><main class="card"><section class="copy"><div class="logo-plate"><img src="/logo-neuracode-horizontal.png" alt="Neuracode"></div><div class="eyebrow">Enterprise · Academy</div><h1>Integramos IA en procesos reales de negocio.</h1></section><section class="visual" aria-hidden="true"><div class="nodes"><div class="node n1"></div><div class="node n2"></div><div class="node n3"></div><div class="line l1"></div><div class="line l2"></div></div></section></main></body></html>
